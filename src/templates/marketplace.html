<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Marketplace Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/marketplace.css') }}">
</head>

<body>
    <div class="header">
        <h1>Marketplace</h1>
        <a href="/nftMinter" class="btn btn-outline">⬅️ Back to Minter</a>
    </div>

    <div id="loader" class="loader-container">
        <div class="loader"></div>
        <p style="color: var(--text-dim)">Fetching Assets from Blockchain...</p>
    </div>

    <div id="emptyState">
        <p style="font-size: 1.5rem; margin-bottom: 20px;">🚀 No NFTs discovered yet.</p>
        <a href="/nftMinter" class="btn btn-outline" style="border-color: var(--accent-primary); color: var(--accent-primary);">Mint the first one!</a>
    </div>

    <div id="grid" class="marketplace-grid">
        <!-- NFT Cards will be injected here -->
    </div>

    <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/marketplace.js') }}"></script>
</body>
</html>
