<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Marketplace Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --accent-primary: #00f2ff;
            --accent-secondary: #7000ff;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --success-color: #00ff88;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Lexend', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 10% 10%, rgba(0, 242, 255, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(112, 0, 255, 0.03) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .header { text-align: center; margin-bottom: 50px; width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; }
        h1 {
            font-size: 2.5rem; font-weight: 800;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }

        .btn { 
            cursor: pointer; border: none; border-radius: 12px; font-weight: 600; 
            padding: 12px 24px; text-decoration: none; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-outline { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--card-border); }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-primary); }

        .marketplace-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .nft-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        .nft-card:hover {
            transform: translateY(-12px);
            border-color: var(--accent-primary);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7);
            background: rgba(255, 255, 255, 0.08);
        }

        .nft-image {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 20px;
            background: #000;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
        }

        .nft-info { padding: 0 4px; }
        .nft-id { font-size: 0.7rem; color: var(--accent-primary); font-weight: 800; margin-bottom: 4px; }
        .nft-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nft-desc { font-size: 0.8rem; color: var(--text-dim); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.24rem; }

        .loader-container { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 100px; width: 100%;
        }
        .loader {
            width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--accent-primary); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #emptyState { text-align: center; color: var(--text-dim); padding: 100px 0; display: none; }
    </style>
</head>

<body>
    <div class="header">
        <h1>Marketplace</h1>
        <a href="/nftMinter" class="btn btn-outline">⬅️ Back to Minter</a>
    </div>

    <div id="loader" class="loader-container">
        <div class="loader"></div>
        <p style="color: var(--text-dim)">Fetching Assets from Blockchain...</p>
    </div>

    <div id="emptyState">
        <p style="font-size: 1.5rem; margin-bottom: 20px;">🚀 No NFTs discovered yet.</p>
        <a href="/nftMinter" class="btn btn-outline" style="border-color: var(--accent-primary); color: var(--accent-primary);">Mint the first one!</a>
    </div>

    <div id="grid" class="marketplace-grid">
        <!-- NFT Cards will be injected here -->
    </div>

    <script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script>
        const defaultContract = "0xb5cEe73CC170D760Ce72817119b79801eE0D461F";
        const abi = [
            "function getItemId() public view returns(uint256)",
            "function tokenURI(uint256 tokenId) public view returns (string memory)",
            "function ownerOf(uint256 tokenId) public view returns (address)"
        ];

        const grid = document.getElementById('grid');
        const loader = document.getElementById('loader');
        const emptyState = document.getElementById('emptyState');

        async function loadNFTs() {
            try {
                let provider;
                if (typeof window.ethereum !== 'undefined') {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                } else {
                    provider = new ethers.providers.JsonRpcProvider("https://ethereum-sepolia-rpc.publicnode.com");
                }

                const contract = new ethers.Contract(defaultContract, abi, provider);
                const totalIds = await contract.getItemId();
                const count = totalIds.toNumber();

                if (count === 0) {
                    loader.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }

                for (let i = count - 1; i >= 0; i--) {
                    let owner = "Unknown";
                    let uri = "";
                    try {
                        const results = await Promise.all([
                            contract.tokenURI(i),
                            contract.ownerOf(i)
                        ]);
                        uri = results[0];
                        owner = results[1];
                        
                        let cid = "";
                        if (uri.includes('/ipfs/')) cid = uri.split('/ipfs/')[1];
                        else if (uri.includes('/ipns/')) cid = uri.split('/ipns/')[1];
                        else if (uri.startsWith('ipfs://')) cid = uri.replace('ipfs://', '');
                        else if (uri.startsWith('ipns://')) cid = uri.replace('ipns://', '');
                        else cid = uri.split('/').pop();

                        let res = await fetch('/metadata/' + cid);
                        if (!res.ok) throw new Error(`Gateway returned ${res.status}`);
                        
                        const metadata = await res.json();
                        if (metadata.error) throw new Error(metadata.error);
                        renderNFT(i, metadata, owner);
                        
                    } catch (err) {
                        console.error(`Error loading metadata for NFT ${i}:`, err);
                        renderFallbackNFT(i, owner, uri);
                    }
                }

                loader.style.display = 'none';
            } catch (err) {
                console.error("Marketplace Error:", err);
                loader.innerHTML = `<p style="color: #ff4d4d">Connection Error: ${err.message}</p>`;
            }
        }

        function renderFallbackNFT(id, owner, uri) {
            const card = document.createElement('div');
            card.className = 'nft-card';
            
            const shortOwner = owner && owner !== "Unknown" ? owner.substring(0, 6) + '...' + owner.substring(38) : "Unknown";
            const fullUri = uri || "No URI";

            card.innerHTML = `
                <div style="width: 100%; aspect-ratio: 1; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; flex-direction: column; text-align: center; padding: 20px; word-break: break-all;">
                    <span style="font-size: 2rem; margin-bottom: 10px;">🔗</span>
                    <span style="font-size: 0.6rem; color: var(--text-dim);">${fullUri}</span>
                </div>
                <div class="nft-info">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span class="nft-id">TOKEN #${id}</span>
                        <span style="font-size: 0.6rem; color: #ffaa00; background: rgba(255, 170, 0, 0.1); padding: 2px 6px; border-radius: 4px;">SYNCING / RAW</span>
                    </div>
                    <div class="nft-title">Minted Asset</div>
                    <div class="nft-desc" style="font-family: monospace; font-size: 0.65rem; word-break: break-all; height: auto;">URI: <a href="${fullUri}" target="_blank" style="color: var(--accent-primary); text-decoration: none;">${fullUri}</a></div>
                    
                    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--card-border); display: flex; align-items: center; gap: 8px;">
                        <div style="width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(45deg, #444, #888);"></div>
                        <div style="flex: 1;">
                            <div style="font-size: 0.55rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800;">Current Owner</div>
                            <div style="font-size: 0.7rem; color: var(--text-main); font-family: 'JetBrains Mono', monospace;">${shortOwner}</div>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        }

        function renderNFT(id, metadata, owner) {
            const card = document.createElement('div');
            card.className = 'nft-card';
            
            let imageUrl = metadata.image || "";
            let cidImg = "";
            let isIpns = imageUrl.includes('ipns');
            
            if (imageUrl.includes('/ipfs/')) cidImg = imageUrl.split('/ipfs/')[1];
            else if (imageUrl.includes('/ipns/')) cidImg = imageUrl.split('/ipns/')[1];
            else if (imageUrl.startsWith('ipfs://')) cidImg = imageUrl.replace('ipfs://', '');
            else if (imageUrl.startsWith('ipns://')) cidImg = imageUrl.replace('ipns://', '');
            else cidImg = imageUrl.split('/').pop();
            
            let basePath = isIpns ? '/ipns/' : '/ipfs/';
            const localImgUrl = 'http://127.0.0.1:8080' + basePath + cidImg;
            const publicImgUrl = 'https://ipfs.io' + basePath + cidImg;

            const shortOwner = owner.substring(0, 6) + '...' + owner.substring(38);

            card.innerHTML = `
                <img src="${localImgUrl}" class="nft-image" alt="${metadata.name}" onerror="this.onerror=null; this.src='${publicImgUrl}'; setTimeout(() => { if (this.naturalWidth === 0) this.src='https://via.placeholder.com/400?text=Asset+Unavailable'; }, 3000);">
                <div class="nft-info">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span class="nft-id">TOKEN #${id}</span>
                        <span style="font-size: 0.6rem; color: var(--success-color); background: rgba(0, 255, 136, 0.1); padding: 2px 6px; border-radius: 4px;">ACTIVE</span>
                    </div>
                    <div class="nft-title">${metadata.name}</div>
                    <div class="nft-desc">${metadata.description}</div>
                    
                    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--card-border); display: flex; align-items: center; gap: 8px;">
                        <div style="width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary));"></div>
                        <div style="flex: 1;">
                            <div style="font-size: 0.55rem; color: var(--text-dim); text-transform: uppercase; font-weight: 800;">Current Owner</div>
                            <div style="font-size: 0.7rem; color: var(--text-main); font-family: 'JetBrains Mono', monospace;">${shortOwner}</div>
                        </div>
                    </div>
                </div>
            `;
            
            card.onclick = () => {
                window.open(`https://testnets.opensea.io/assets/sepolia/${defaultContract}/${id}`, '_blank');
            };

            grid.appendChild(card);
        }

        window.onload = loadNFTs;
    </script>
</body>

</html>
